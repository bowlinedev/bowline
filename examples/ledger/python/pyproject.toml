[project]
name = "ledger-python"
version = "0.5.0"
description = "Python client for the ledger example, generated by bowline"
requires-python = ">=3.11"
dependencies = ["bowline-client"]

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.uv.sources]
bowline-client = { path = "../../../packages/python/bowline-client", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bowline.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["."]
asyncio_mode = "auto"
