name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter ledger-web build
      - run: pnpm --filter ledger-web exec playwright install --with-deps chromium
      - run: pnpm --filter ledger-web test:e2e
        env:
          CI: "1"

  ledger-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/react-query build
      - run: pnpm --filter ledger-web build
      - run: pnpm --filter ledger-web exec playwright install --with-deps chromium
      - run: pnpm --filter ledger-web test:e2e:mock
        env:
          CI: "1"

  sveltekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/svelte build
      - run: pnpm --filter bowline-sveltekit-example check:gen
      - run: pnpm --filter bowline-sveltekit-example check
      - run: pnpm --filter bowline-sveltekit-example build
      - run: pnpm --filter bowline-sveltekit-example exec playwright install --with-deps chromium
      - run: pnpm --filter bowline-sveltekit-example test:e2e
        env:
          CI: "1"

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build
      - run: pnpm --filter @bowline/playground build
      - run: pnpm --filter @bowline/playground exec playwright install --with-deps chromium
      - run: pnpm --filter @bowline/playground test:e2e
        env:
          CI: "1"

  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/solid build
      - run: pnpm --filter ledger-astro check:gen
      - run: pnpm --filter ledger-astro build
      - run: pnpm --filter ledger-astro exec playwright install --with-deps chromium
      - run: pnpm --filter ledger-astro test:e2e
        env:
          CI: "1"

  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/react-query build
      - run: pnpm --filter example-nextjs check:gen
      - run: pnpm --filter example-nextjs build
      - run: pnpm --filter example-nextjs exec playwright install --with-deps chromium
      - run: pnpm --filter example-nextjs test:e2e
        env:
          CI: "1"

  remix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/react-query build
      - run: pnpm --filter example-remix check:gen
      - run: pnpm --filter example-remix build
      - run: pnpm --filter example-remix exec playwright install --with-deps chromium
      - run: pnpm --filter example-remix test:e2e
        env:
          CI: "1"

  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ledger-expo check:gen
      - run: pnpm --filter ledger-expo typecheck
      - run: pnpm --filter ledger-expo test

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4
      - name: dart ledger client against the Go server
        working-directory: examples/ledger/dart
        run: dart pub get && dart analyze --fatal-infos && dart test
