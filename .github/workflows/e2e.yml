name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter ledger-web build
      - run: pnpm --filter ledger-web exec playwright install --with-deps chromium
      - run: pnpm --filter ledger-web test:e2e
        env:
          CI: "1"

  ledger-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/react-query build
      - run: pnpm --filter ledger-web build
      - run: pnpm --filter ledger-web exec playwright install --with-deps chromium
      - run: pnpm --filter ledger-web test:e2e:mock
        env:
          CI: "1"

  sveltekit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/svelte build
      - run: pnpm --filter bowline-sveltekit-example check:gen
      - run: pnpm --filter bowline-sveltekit-example check
      - run: pnpm --filter bowline-sveltekit-example build
      - run: pnpm --filter bowline-sveltekit-example exec playwright install --with-deps chromium
      - run: pnpm --filter bowline-sveltekit-example test:e2e
        env:
          CI: "1"

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build
      - run: pnpm --filter @bowline/playground build
      - run: pnpm --filter @bowline/playground exec playwright install --with-deps chromium
      - run: pnpm --filter @bowline/playground test:e2e
        env:
          CI: "1"

  registry-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            examples/ledger/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build
      - run: pnpm --filter @bowline/registry-ui build
      - run: pnpm --filter @bowline/registry-ui exec playwright install --with-deps chromium
      - run: pnpm --filter @bowline/registry-ui test:e2e
        env:
          CI: "1"

  astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/solid build
      - run: pnpm --filter ledger-astro check:gen
      - run: pnpm --filter ledger-astro build
      - run: pnpm --filter ledger-astro exec playwright install --with-deps chromium
      - run: pnpm --filter ledger-astro test:e2e
        env:
          CI: "1"

  nextjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/react-query build
      - run: pnpm --filter example-nextjs check:gen
      - run: pnpm --filter example-nextjs build
      - run: pnpm --filter example-nextjs exec playwright install --with-deps chromium
      - run: pnpm --filter example-nextjs test:e2e
        env:
          CI: "1"

  remix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/react-query build
      - run: pnpm --filter example-remix check:gen
      - run: pnpm --filter example-remix build
      - run: pnpm --filter example-remix exec playwright install --with-deps chromium
      - run: pnpm --filter example-remix test:e2e
        env:
          CI: "1"

  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ledger-expo check:gen
      - run: pnpm --filter ledger-expo typecheck
      - run: pnpm --filter ledger-expo test

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4
      - name: dart ledger client against the Go server
        working-directory: examples/ledger/dart
        run: dart pub get && dart analyze --fatal-infos && dart test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ledger/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: examples/ledger/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m mypy --strict ledger_cli.py test_ledger.py
      - run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            examples/ledger/go.sum
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: Rust ledger client against the Go server
        working-directory: examples/ledger/rust
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test

  elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"
      - run: mix deps.get
        working-directory: examples/ledger/elixir
      - run: mix format --check-formatted
        working-directory: examples/ledger/elixir
      - run: mix compile --warnings-as-errors
        working-directory: examples/ledger/elixir
      - run: mix test
        working-directory: examples/ledger/elixir

  federation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            examples/ledger/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowline/client build && pnpm --filter @bowline/react-query build
      - name: the billing service and its signed ledger client
        working-directory: examples/federation/billing
        run: go vet ./... && go test -race ./...
      - name: the composed contract is current
        working-directory: examples/federation/gateway
        run: |
          go run ../../../cmd/bowline gateway compose -o composed-check.json
          diff composed.contract.json composed-check.json
          rm composed-check.json
      - run: pnpm --filter federation-web build
      - run: pnpm --filter federation-web exec playwright install --with-deps chromium
      - run: pnpm --filter federation-web test:e2e
        env:
          CI: "1"
      - name: the registry names the consumer a breaking change would hit
        run: |
          ./examples/federation/registry-seed.sh
          ./examples/federation/impact-check.sh
