name: fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            package: .
            target: FuzzHandler
          - module: .
            package: ./contract
            target: FuzzContractParse
          - module: .
            package: ./contract
            target: FuzzContractHash
          - module: .
            package: ./internal/codec
            target: FuzzDecode
          - module: .
            package: ./internal/validate
            target: FuzzValidateParseTag
          - module: .
            package: ./internal/validate
            target: FuzzValidateCheck
          - module: .
            package: ./signing
            target: FuzzVerify
          - module: .
            package: ./signing
            target: FuzzReplayCache
          - module: .
            package: ./internal/codec
            target: FuzzNormalizeEquivalence
          - module: cmd/bowline
            package: ./internal/gen/ts
            target: FuzzTSGenerator
          - module: cmd/bowline
            package: ./internal/analyzer
            target: FuzzAnalyzerMutatesFidelityRows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 10m ${{ matrix.package }}
      - name: collect crashers
        if: failure()
        run: |
          found=0
          while IFS= read -r dir; do
            found=1
            echo "== $dir"
            ls -1 "$dir"
          done < <(find . -type d -path '*/testdata/fuzz/*' -not -empty)
          if [ "$found" -eq 0 ]; then echo "no crashers on disk"; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: crashers-${{ matrix.target }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowlinedev/client exec vitest run src/client.fuzz.test.ts
