name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      registry:
        description: Which registry to publish to
        type: choice
        default: npm
        options: [npm, pypi, all]
      tag:
        description: Re-run the binary release for an existing tag, such as v1.1.0
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  cli:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowlinedev/client build
      - name: embed the playground bundle in the playground module tag
        run: |
          if git ls-remote --exit-code --tags origin "playground/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "playground/${RELEASE_TAG} already exists; leaving it alone"
            exit 0
          fi
          pnpm --filter @bowlinedev/playground build
          git add -f playground/ui/dist
          git -c user.name=bowline-release -c user.email=release@bowline.dev commit -s -m "chore(playground): embed the release bundle"
          git tag -f "playground/${RELEASE_TAG}"
          git push -f origin "playground/${RELEASE_TAG}"
          git checkout -q "$(git rev-parse "${RELEASE_TAG}")"
      - name: embed the registry bundle in the registry module tag
        run: |
          if git ls-remote --exit-code --tags origin "registry/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "registry/${RELEASE_TAG} already exists; leaving it alone"
            exit 0
          fi
          pnpm --filter @bowlinedev/registry-ui build
          git add -f registry/ui/dist
          git -c user.name=bowline-release -c user.email=release@bowline.dev commit -s -m "chore(registry): embed the release bundle"
          git tag -f "registry/${RELEASE_TAG}"
          git push -f origin "registry/${RELEASE_TAG}"
          git checkout -q "$(git rev-parse "${RELEASE_TAG}")"
      - name: ensure module tags exist
        run: |
          for tag in "cmd/bowline/${RELEASE_TAG}" "transport/websocket/${RELEASE_TAG}" "mcp/${RELEASE_TAG}" "agent/${RELEASE_TAG}" "contracttest/${RELEASE_TAG}" "adapters/fiber/${RELEASE_TAG}" "gateway/${RELEASE_TAG}" "otel/${RELEASE_TAG}"; do
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              git tag "$tag" "$(git rev-parse "${RELEASE_TAG}")"
              git push origin "$tag"
            fi
          done
      - name: count the binaries already attached to the release
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "assets=$(gh release view "$RELEASE_TAG" --json assets -q '.assets | length' 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        if: steps.published.outputs.assets == '0'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        if: steps.published.outputs.assets == '0'
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  npm:
    if: github.event_name == 'workflow_dispatch' && (inputs.registry == 'npm' || inputs.registry == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  pypi:
    if: github.event_name == 'workflow_dispatch' && (inputs.registry == 'pypi' || inputs.registry == 'all')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python/bowline-agent
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/bowline-agent/dist

  dart:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/dart/bowline
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
