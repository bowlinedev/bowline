name: release-clients

on:
  workflow_dispatch:
    inputs:
      python:
        description: Publish bowline-client to PyPI
        type: boolean
        default: false
      rust:
        description: Publish bowline-client to crates.io
        type: boolean
        default: false
      elixir:
        description: Publish bowline_client to Hex
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  python:
    if: inputs.python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python/bowline-client
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/bowline-client/dist

  rust:
    if: inputs.rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust/bowline-client
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  elixir:
    if: inputs.elixir
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/elixir/bowline_client
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix deps.get
      - run: mix hex.build
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
