name: npm-doctor

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bowlinedev/agent build
      - name: attempt one real publish, verbosely
        working-directory: packages/agent
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "--- scope membership"
          npm org ls bowlinedev || true
          echo "--- packages visible in the scope"
          npm access list packages @bowlinedev || true
          echo "--- publish attempt"
          npm publish --access public --provenance --loglevel verbose 2>&1 | tail -30
