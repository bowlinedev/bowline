name: bench-publish

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "internal/bench/**"
      - "scripts/bench-report.go"
      - ".github/workflows/bench-publish.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: measure
        run: |
          go test -run '^$' -bench . -benchmem -count 10 . | tee bench.txt
          (cd cmd/bowline && go test -run '^$' -bench BenchmarkGenerators -benchmem -count 3 ./internal/cli) | tee -a bench.txt
          (cd cmd/bowline && go test -run '^$' -bench BenchmarkDevLoopUpdate -benchmem -benchtime 5x -count 3 ./internal/analyzer) | tee -a bench.txt

      - name: fetch history
        run: |
          mkdir -p history
          if git ls-remote --exit-code --heads origin bench >/dev/null 2>&1; then
            git fetch origin bench:bench
            git archive bench -- history 2>/dev/null | tar -x || echo "no history directory on bench yet"
          else
            echo "no bench branch yet; rendering without a baseline"
          fi
          ls -1 history | wc -l

      - name: render
        id: render
        run: |
          go run ./scripts \
            -in bench.txt \
            -history history \
            -run-out "history/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}.json" \
            -report-out docs/benchmarks.md \
            -commit "$GITHUB_SHA" \
            -fail-on-regression
      - name: summary
        if: always()
        run: cat docs/benchmarks.md >> "$GITHUB_STEP_SUMMARY"

      - name: publish history
        if: github.event_name != 'pull_request'
        run: |
          git config user.name bowline-bench
          git config user.email bench@bowline.dev
          rm -rf .bench-branch
          if git ls-remote --exit-code --heads origin bench >/dev/null 2>&1; then
            git worktree add .bench-branch bench
          else
            git worktree add --detach .bench-branch
            git -C .bench-branch checkout --orphan bench
            git -C .bench-branch rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p .bench-branch/history
          cp history/*.json .bench-branch/history/
          git -C .bench-branch add history
          git -C .bench-branch commit -s -m "chore(bench): record the run for ${GITHUB_SHA:0:12}" || echo "nothing new to record"
          git -C .bench-branch push origin bench

      - name: open the report pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: docs/benchmarks.md
          branch: bench-report
          base: main
          title: "docs: refresh the benchmark report"
          body: Regenerated by the bench-publish workflow from the runs recorded on the bench branch.
          commit-message: "docs: refresh the benchmark report"
          signoff: true
          delete-branch: false
