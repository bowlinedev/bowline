name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", "stable"]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: ${{ matrix.go == '1.24' && 'off' || '' }}
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            cmd/bowline/go.sum
            examples/ledger/go.sum
            examples/nethttp-minimal/go.sum
            examples/routers/chi/go.sum
            examples/routers/gin/go.sum
            examples/routers/echo/go.sum
            examples/routers/connect/go.sum
            transport/websocket/go.sum
            mcp/go.sum
            agent/go.sum
            contracttest/go.sum
            adapters/fiber/go.sum
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet and test runtime module
        run: go vet ./... && go test -race ./...
      - name: vet and test ledger example
        working-directory: examples/ledger
        run: go vet ./... && go test -race ./...
      - name: vet and test minimal example
        working-directory: examples/nethttp-minimal
        run: go vet ./... && go test ./...
      - name: vet and test go-client example
        working-directory: examples/go-client
        run: go vet ./... && go test -race ./...
      - name: vet and test router examples
        if: matrix.go == 'stable'
        run: for d in examples/routers/*; do (cd "$d" && go vet ./... && go test -race ./...); done
      - name: vet and test cli module
        if: matrix.go == 'stable'
        working-directory: cmd/bowline
        run: go vet ./... && go test -race ./...
      - name: vet and test websocket transport
        if: matrix.go == 'stable'
        working-directory: transport/websocket
        run: go vet ./... && go test -race ./...
      - name: vet and test mcp server
        if: matrix.go == 'stable'
        working-directory: mcp
        run: go vet ./... && go test -race ./...
      - name: vet and test fiber adapter
        if: matrix.go == 'stable'
        working-directory: adapters/fiber
        run: go vet ./... && go test -race ./...
      - name: vet and test fiber example
        if: matrix.go == 'stable'
        working-directory: examples/routers/fiber
        run: go vet ./... && go test -race ./...
      - name: vet and test agent module
        if: matrix.go == 'stable'
        working-directory: agent
        run: go vet ./... && go test -race ./...
      - name: vet and test playground
        if: matrix.go == 'stable'
        working-directory: playground
        run: go vet ./... && go test -race ./...
      - name: vet and test contracttest
        if: matrix.go == 'stable'
        working-directory: contracttest
        run: go vet ./... && go test -race ./...
      - name: contracts are current
        if: matrix.go == 'stable'
        run: |
          (cd examples/ledger && go run github.com/bowlinedev/bowline/cmd/bowline check)
          (cd examples/nethttp-minimal && go run github.com/bowlinedev/bowline/cmd/bowline check)
      - name: consumer contracts still hold
        if: matrix.go == 'stable'
        run: (cd examples/ledger && go run github.com/bowlinedev/bowline/cmd/bowline verify-consumers)
      - name: staticcheck
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          (cd cmd/bowline && staticcheck ./...)
          (cd transport/websocket && staticcheck ./...)
          (cd mcp && staticcheck ./...)
          (cd agent && staticcheck ./...)
          (cd contracttest && staticcheck ./...)
          (cd adapters/fiber && staticcheck ./...)
          (cd playground && staticcheck ./...)
      - name: runtime module has no dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          if grep -q '^require' go.mod; then echo "root go.mod must not require anything"; exit 1; fi

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: python/bowline-agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python -m mypy --strict src tests
      - run: uv run pytest

  goldens-dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4
      - name: runtime package
        working-directory: packages/dart/bowline
        run: dart pub get && dart analyze --fatal-infos && dart format --set-exit-if-changed . && dart test
      - name: goldens analyze against the runtime
        run: scripts/check-goldens.sh dart
      - name: ledger client analyzes
        working-directory: examples/ledger/dart
        run: dart pub get && dart analyze --fatal-infos
  goldens-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: runtime package
        working-directory: packages/python/bowline-client
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run python -m mypy --strict src tests
          uv run pytest
      - name: generated goldens type-check and round-trip
        run: scripts/check-goldens.sh python

  goldens-elixir:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"
      - name: runtime package
        working-directory: packages/elixir/bowline_client
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
      - name: goldens compile
        run: scripts/check-goldens.sh elixir

  docs-check:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            cmd/bowline/go.sum
            examples/ledger/go.sum
      - name: run every runnable block in the guides
        run: scripts/docs-check.sh
      - name: guide snippets match their sources
        run: scripts/check-snippets.sh

  goldens-rust:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            cmd/bowline/go.sum
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - name: runtime crate
        working-directory: packages/rust/bowline-client
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
      - name: generated goldens compile
        run: scripts/check-goldens.sh rust

  devloop-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: session and watcher on Windows
        working-directory: cmd/bowline
        run: go test ./internal/analyzer -run 'TestSession|TestDevLoopBudget' -v && go test ./internal/watch -v && go test ./internal/cli -run TestDev -v

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every commit is signed off
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "missing sign-off: $sha"; missing=1
            fi
          done
          exit $missing

  ci:
    runs-on: ubuntu-latest
    needs: [go, node, python, goldens-dart, docs-check, devloop-windows, goldens-python, goldens-rust, goldens-elixir]
    steps:
      - run: echo ok
