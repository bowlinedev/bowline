version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The version here pins the crate's declared MSRV (rust-version in
      # Cargo.toml), not an action release. Bumping it silently stops CI
      # proving the MSRV, and Dependabot invents versions Rust never shipped.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: gomod
    directories:
      - /cmd/bowline
      - /transport/websocket
      - /adapters/fiber
      - /otel
      - /stores/sql
      - /stores/redis
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
