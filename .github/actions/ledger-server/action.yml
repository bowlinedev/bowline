name: bowline ledger server
description: Build the ledger example server and start it in the background for end-to-end jobs
inputs:
  addr:
    description: Address to listen on
    required: false
    default: "127.0.0.1:8080"
  token:
    description: Value for LEDGER_TOKEN; empty leaves invoices unguarded
    required: false
    default: ""
outputs:
  url:
    description: Base URL of the API
    value: ${{ steps.start.outputs.url }}
runs:
  using: composite
  steps:
    - name: start the ledger server
      id: start
      shell: bash
      env:
        ADDR: ${{ inputs.addr }}
        LEDGER_TOKEN: ${{ inputs.token }}
        LEDGER_FIXED_TIME: 2026-09-15T12:00:00Z
      run: |
        (cd examples/ledger && go build -buildvcs=false -o "$RUNNER_TEMP/ledger" ./cmd/server)
        nohup "$RUNNER_TEMP/ledger" > "$RUNNER_TEMP/ledger.log" 2>&1 &
        for _ in $(seq 1 100); do
          if curl -fsS "http://$ADDR/api/health" >/dev/null 2>&1; then break; fi
          sleep 0.2
        done
        curl -fsS "http://$ADDR/api/health" >/dev/null
        echo "url=http://$ADDR/api" >> "$GITHUB_OUTPUT"
