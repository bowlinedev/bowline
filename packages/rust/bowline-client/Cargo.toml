[package]
name = "bowline-client"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Runtime for clients generated by Bowline from a Go API contract"
repository = "https://github.com/bowlinedev/bowline"
keywords = ["api", "client", "codegen", "rpc"]
categories = ["web-programming::http-client"]

[dependencies]
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
