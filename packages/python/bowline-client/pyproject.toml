[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bowline-client"
version = "1.4.1"
description = "Runtime for Bowline generated Python clients"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["httpx>=0.27", "pydantic>=2.7"]
keywords = ["bowline", "api", "client", "codegen", "contract", "typed", "rpc", "pydantic"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/bowlinedev/bowline"

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/bowline_client"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
