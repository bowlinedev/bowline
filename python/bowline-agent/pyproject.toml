[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bowline-agent"
version = "1.1.0"
description = "Typed LLM tool definitions and dispatch for Bowline APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []
keywords = ["bowline", "api", "llm", "tools", "agent", "mcp", "typed", "json-schema"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/bowlinedev/bowline"

[dependency-groups]
dev = ["mypy>=1.14", "pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/bowline_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
